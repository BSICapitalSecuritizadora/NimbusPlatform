name: Deploy Laravel to Azure App Service

on:
  workflow_dispatch: # Desativado: deploy via main_bsicapital.yml com OIDC

jobs:
  build-php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5' # Verifique a versão que você selecionou no Azure
          extensions: mbstring, bcmath, pdo_mysql, zip

      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install NPM dependencies and build assets
        run: |
          npm install
          npm run build

      # storage/app/** contém os documentos privados enviados em produção e não
      # pode entrar no pacote — o deploy substituiria os arquivos existentes.
      - name: Zip artifact for deployment
        run: |
          zip -r release.zip . \
            -x ".git/*" \
            -x ".github/*" \
            -x "node_modules/*" \
            -x "tests/*" \
            -x "docs/*" \
            -x "infra/*" \
            -x ".env" \
            -x ".env.staging" \
            -x ".env.testing" \
            -x ".env.example.production" \
            -x "storage/app/*" \
            -x "storage/logs/*" \
            -x "storage/framework/cache/*" \
            -x "storage/framework/sessions/*" \
            -x "storage/framework/views/*"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: php-app
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build-php
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: php-app

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'bsicapital' # <--- SUBSTITUA PELO NOME DO SEU APP SERVICE
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: release.zip
