# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy PHP app to Azure Web App - bsicapital

concurrency:
  group: bsicapital-production
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, bcmath, pdo_mysql, zip

      - name: Add Flux Credentials
        run: composer config http-basic.composer.fluxui.dev "${{ secrets.FLUX_USERNAME }}" "${{ secrets.FLUX_LICENSE_KEY }}"

      - name: Install Composer dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --no-progress --optimize-autoloader

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install Node dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Prepare Laravel storage directories
        run: |
          mkdir -p storage/framework/cache
          mkdir -p storage/framework/sessions
          mkdir -p storage/framework/views
          mkdir -p storage/logs

      # storage/app/** guarda os documentos privados enviados em produção.
      # Ele NUNCA pode entrar no pacote, senão o deploy sobrescreve os arquivos
      # do App Service com o diretório vazio do runner.
      - name: Package application
        run: |
          zip -r app.zip . \
            -x ".git/*" \
            -x ".github/*" \
            -x ".env*" \
            -x "*/.env*" \
            -x "App_Data/*" \
            -x "compose.yaml" \
            -x "compose.yml" \
            -x "docs/*" \
            -x "fix_*.php" \
            -x "fix_*.py" \
            -x "infra/*" \
            -x "node_modules/*" \
            -x "tests/*" \
            -x "update_*.php" \
            -x "NUL" \
            -x "storage/app/*" \
            -x "storage/logs/*" \
            -x "storage/framework/cache/*" \
            -x "storage/framework/sessions/*" \
            -x "storage/framework/views/*"

      # Entradas de diretório são inofensivas; arquivos dentro de storage/app não.
      - name: Assert private storage is not packaged
        run: |
          if unzip -Z1 app.zip | grep -qE "^storage/app/.*[^/]$"; then
            echo "::error::O pacote contém arquivos em storage/app — o deploy destruiria os documentos privados."
            unzip -Z1 app.zip | grep -E "^storage/app/.*[^/]$" | head
            exit 1
          fi

      - name: Assert repository-only files are not packaged
        run: |
          forbidden_entries="$(unzip -Z1 app.zip | grep -E '(^|/)\.env[^/]*$|^(docs|infra|App_Data)/|^compose\.ya?ml$|^fix_[^/]*\.(php|py)$|^update_[^/]*\.php$|^NUL$' || true)"
          if [ -n "$forbidden_entries" ]; then
            echo "::error::O pacote contém arquivos exclusivos do repositório ou dados operacionais."
            printf '%s\n' "$forbidden_entries" | head
            exit 1
          fi

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: php-app
          path: app.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v8
        with:
          name: php-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_7B3E4B28FD774ABDA86E1932A034E8A5 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_72A9DC509B6B49A19A7694F9B598AD7E }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_F859E8A3A6B349599FDC866542D6B7F8 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'bsicapital'
          slot-name: 'Production'
          package: app.zip
